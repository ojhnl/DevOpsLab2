name: CI

on:
  push:

jobs:
  Linter:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          python -m flake8 src/

  Security-Check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search for passwords and keys
        shell: bash
        run: |
          echo "Запуск Security Check..."

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          if git log -p --format= "$RANGE" -- . ':!.github/workflows/ci.yml' | grep -Ein 'password|key='; then
            echo "Обнаружены потенциальные пароли или ключи!"
            exit 1
          else
            echo "Потенциальных паролей или ключей не обнаружено."
          fi
